<!doctype html><html><head><meta charset="utf-8"><title>Smoke</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css"><link rel="stylesheet" href="../vendor/fonts/pagella.css"><link rel="stylesheet" href="../vendor/katex/katex.min.css">
<style>body{margin:0;background:#111;display:grid;grid-template-columns:repeat(3,1fr);gap:4px} .c{height:300px}</style></head><body>
<script src="../src/core/rng.js"></script>
<script src="../src/core/expr.js"></script>
<script src="../src/core/sim.js"></script>
<script src="../src/core/analysis.js"></script>
<script src="../src/render/style.js"></script>
<script src="../src/render/frame.js"></script>
<script src="../src/render/mathtype.js"></script>
<script src="../src/render/views.js"></script>
<script src="../src/render/player.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script>
const S = {"flow": {"name": "ML", "system": "x1' = x1*(1 - x1 - a*x2 - b*x3)\nx2' = x2*(1 - x2 - a*x3 - b*x1)\nx3' = x3*(1 - x3 - a*x1 - b*x2)\nparam a = 0.8 [0, 2]\nparam b = 1.3 [0, 2]\ninit x1 = 0.3\ninit x2 = 0.35\ninit x3 = 0.34\nrange x1 = [0, 1]\nrange x2 = [0, 1]\nrange x3 = [0, 1]", "view": {"type": "flow", "projection": "simplex", "spawn": "mixed"}, "dt": 0.05, "overlay": {"title": "May-Leonard", "subtitle": "Flow view"}}, "trajectory": {"system": "x' = s*(y-x)\ny' = x*(r-z) - y\nz' = x*y - b*z\nparam s = 10\nparam r = 28 [0, 50]\nparam b = 2.6667\ninit x = 1\ninit y = 1\ninit z = 1", "view": {"type": "trajectory", "warmup": 100}, "dt": 0.005, "stepsPerFrame": 4, "overlay": {"title": "Lorenz", "equations": true, "readout": true}}, "timeseries": {"system": "x' = y\ny' = mu*(1 - x^2)*y - x\nparam mu = 2 [0, 10]\ninit x = 2", "view": {"type": "timeseries"}, "overlay": {"title": "Van der Pol"}}, "phase": {"system": "N' = r*N*(1 - N/K) - a*N*P/(1 + a*h*N)\nP' = e*a*N*P/(1 + a*h*N) - m*P\nparam r = 1\nparam K = 6 [1, 12]\nparam a = 1\nparam h = 0.4\nparam e = 0.6\nparam m = 0.3\ninit N = 5\ninit P = 1\nrange N = [0, 6.5]\nrange P = [0, 4]", "view": {"type": "phase"}, "overlay": {"title": "Rosenzweig-MacArthur", "legend": true}}, "sweep": {"system": "x' = r + x - x^3\nparam r = 0 [-0.8, 0.8]\ninit x = -1\nrange x = [-1.5, 1.5]", "view": {"type": "sweep", "param": "r"}, "overlay": {"title": "Fold catastrophe"}}, "orbit": {"system": "x[n+1] = r*x*(1-x)\nparam r = 3.5 [2.8, 4]\ninit x = 0.3\nrange x = [0, 1]", "view": {"type": "orbit", "param": "r"}, "style": {"alpha": 0.25}, "overlay": {"title": "Logistic map"}}, "density": {"system": "x' = x - x^3\nnoise x = sigma\nparam sigma = 0.45\ninit x = -1\nrange x = [-2, 2]", "view": {"type": "density", "window": 80}, "overlay": {"title": "Double well"}, "style": {"ramp": "magma"}}, "strobe": {"system": "x' = y\ny' = -delta*y - alpha*x - beta*x^3 + gamma*cos(omega*t)\nparam delta = 0.3\nparam alpha = -1\nparam beta = 1\nparam gamma = 0.5\nparam omega = 1.2\ninit x = 0.1\nrange x = [-2, 2]\nrange y = [-1.6, 1.6]", "view": {"type": "strobe", "period": 5.235987755982989, "transient": 5}, "n": 400, "spread": 0.5, "dt": 0.02, "stepsPerFrame": 60, "overlay": {"title": "Duffing strobe"}}, "cobweb": {"system": "x[n+1] = r*x*(1-x)\nparam r = 3.83\ninit x = 0.2\nrange x = [0, 1]", "view": {"type": "cobweb"}, "overlay": {"title": "Cobweb"}}};
window.players = [];
window.errors = [];
for (const k in S) { const d = document.createElement('div'); d.className='c'; d.id=k; document.body.appendChild(d);
  try { const p = new RElabFlow.Player(d, S[k]); p.on('error', e => window.errors.push(k+': '+e.message)); p.play(); window.players.push(p); } catch(e) { window.errors.push(k+': '+e.stack); } }
</script></body></html>
