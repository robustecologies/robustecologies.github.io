version = 1
SPDX-PackageName = "robustecologies.github.io"
SPDX-PackageSupplier = "Pablo Almaraz <pablo.almaraz@csic.es>"
SPDX-PackageDownloadLocation = "https://github.com/robustecologies/robustecologies.github.io"

# When several annotations match a file, the last one applies.

# Content: text, figures, images and data of the site.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Pablo Almaraz <pablo.almaraz@csic.es>"
SPDX-License-Identifier = "CC-BY-4.0"

# Pages and page sources hold text (CC BY 4.0) together with code: inline
# scripts, live-figure scenes and code shown in posts (GPL-3.0-or-later).
[[annotations]]
path = ["**/*.html", "**/page.json", "404.json", "**/body.md"]
SPDX-FileCopyrightText = "Pablo Almaraz <pablo.almaraz@csic.es>"
SPDX-License-Identifier = "CC-BY-4.0 AND GPL-3.0-or-later"

# Code: scripts and style sheets written by RElabSite, including the engine of the live figures.
[[annotations]]
path = ["assets/js/**", "assets/site.css", "assets/fonts/*.css"]
SPDX-FileCopyrightText = "2026 Pablo Almaraz, Robust Ecologies Lab"
SPDX-License-Identifier = "GPL-3.0-or-later"

